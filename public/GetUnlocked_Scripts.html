It's not their marketing. It's not their brokerage. It's not their years of experience.

What do you think it is?`},
      {title:"The First Deal in 7 Days", content:`An agent called me last year. She hadn't closed a deal in 6 months.

      {title:"The File Nobody Wants", content:`Self-employed. 1099 income. Just changed jobs. Credit not perfect.

      {title:"The 47 Days", content:`Agent called me Friday. Deal was supposed to close Monday.

      {title:"The Backup Plan", content:`Every agent has a preferred lender.

Until that lender can't perform.

When's the last time your lender saved a deal that was already dead?`},
      {title:"The Commission Math", content:`Most agents I talk to have lost at least 2-3 deals this year to lender issues.

At an average commission of $12,000 per deal — that's $24,000-$36,000 that walked out the door.

Not because the buyer wasn't qualified.

Because the lender couldn't close.

What would you do differently if you knew your next deal was guaranteed to close?`},
      {title:"The Upstream Problem", content:`Here's what most agents don't realize:

By the time a buyer calls you, they've already decided their price range, their timeline, and half the time — their lender.

The agents getting the most referrals aren't chasing buyers.

They're getting sent buyers who are already pre-qualified, already educated, and already ready.

How are buyers finding you right now — before they find an agent?`}

// ─── STATE ─────────────────────────────────────────────────────────────────
let currentSection = 'scripts';
let scriptCat = 0;
let ioiCat = 0;
let scriptScenario = 0;
let ioiPost = 0;

// ─── RENDER ────────────────────────────────────────────────────────────────
function showSection(sec) {
  currentSection = sec;
  document.getElementById('btnScripts').className = 'section-btn' + (sec==='scripts'?' active':'');
  document.getElementById('btnIOI').className = 'section-btn' + (sec==='ioi'?' active':'');
  document.getElementById('panel-scripts').className = 'section-panel' + (sec==='scripts'?' visible':'');
  document.getElementById('panel-ioi').className = 'section-panel' + (sec==='ioi'?' visible':'');
  renderNav();
  if(sec==='scripts') renderScriptPanel();
  else renderIOIPanel();
}

function renderNav() {
  const nav = document.getElementById('catNav');
  nav.innerHTML = '';
  const data = currentSection==='scripts' ? SCRIPTS : IOI;
  const activeIdx = currentSection==='scripts' ? scriptCat : ioiCat;
  data.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i===activeIdx?' active':'');
    btn.textContent = cat.label;
    if(i===activeIdx){ btn.style.background=cat.color; btn.style.borderColor=cat.color; btn.style.color='#fff'; }
    btn.onclick = () => {
      if(currentSection==='scripts'){ scriptCat=i; scriptScenario=0; renderScriptPanel(); }
      else { ioiCat=i; ioiPost=0; renderIOIPanel(); }
      renderNav();
    };
    nav.appendChild(btn);
  });
}

function renderScriptPanel() {
  const panel = document.getElementById('panel-scripts');
  const cat = SCRIPTS[scriptCat];
  const sc = cat.scenarios[scriptScenario];
  panel.innerHTML = `
    <div class="framework-note"><strong>The framework:</strong> Open with one question. Then stop talking. The gold is always in what they say next. No pitch until they've talked for at least 60 seconds.</div>
    <div class="cat-header">
      <div><div class="cat-label" style="color:${cat.color}">${cat.label}</div><div class="cat-sub">${cat.sub}</div></div>
      <div class="cat-count" style="background:${cat.bg};color:${cat.color}">${cat.scenarios.length} scenario${cat.scenarios.length>1?'s':''}</div>
    </div>
    <div class="tabs" id="scriptTabs"></div>
    <div id="scriptCard"></div>
  `;
  const tabs = document.getElementById('scriptTabs');
  cat.scenarios.forEach((s,i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===scriptScenario?' active':'');
    btn.textContent = s.label;
    if(i===scriptScenario){ btn.style.borderColor=cat.color; btn.style.background=cat.color+'22'; btn.style.color=cat.color; }
    btn.onclick = () => { scriptScenario=i; renderScriptPanel(); };
    tabs.appendChild(btn);
  });
  document.getElementById('scriptCard').innerHTML = `
    <div class="content-card" style="border-color:${cat.bd}">
      <div class="content-title" style="color:${cat.color}">${sc.label}</div>
      <div class="content-badge" style="background:${cat.bg};color:${cat.color}">${sc.tag}</div>
      <div class="content-body">${sc.body}</div>
      ${sc.notes?`<div class="content-notes">${sc.notes}</div>`:''}
      <button class="copy-btn" id="copyScriptBtn" onclick="copyText('copyScriptBtn', \`${sc.body.replace(/`/g,'\\`').replace(/\\/g,'\\\\')}\`)">Copy Script</button>
    </div>
  `;
}

function renderIOIPanel() {
  const panel = document.getElementById('panel-ioi');
  const cat = IOI[ioiCat];
  const post = cat.posts[ioiPost];
  panel.innerHTML = `
    <div class="framework-note"><strong>IOI rules:</strong> No offer. No pitch. No yes/no choice. Curiosity + self-interest + emotion only. Post publicly. Pitch happens in DMs after they respond.</div>
    <div class="cat-header">
      <div><div class="cat-label" style="color:${cat.color}">${cat.label}</div><div class="cat-sub">${cat.sub}</div></div>
      <div class="cat-count" style="background:${cat.bg};color:${cat.color}">${cat.posts.length} post${cat.posts.length>1?'s':''}</div>
    </div>
    ${ioiCat===1?`<div class="strategy-block">
      <div class="strategy-title">The Agent Strategy — How It Actually Works</div>
      <div class="strategy-body">You generate buyer leads upstream through IOI content, social media, and education — before buyers ever talk to an agent. You pre-qualify them using the two-question close: desired monthly payment and cash to close. Then you distribute those pre-qualified buyers to agent partners.\n\nAgents get buyers sent to them at no cost. You close the loans. Agents also earn W-2 marketing compensation (0.25–1% of loan amount) for co-marketing — meaning they get paid twice on deals through the partnership.\n\nThe agents you target are the 71% who closed zero deals. They don't need more training. They need one deal. You give them that deal. They become believers. They refer their sphere. The flywheel starts.\n\nWhat makes this different from every other lender pitch: you're not asking for referrals. You're offering leads. That's a completely different conversation.</div>
    </div>`:''}
    <div class="tabs" id="ioiTabs"></div>
    <div id="ioiCard"></div>
  `;
  const tabs = document.getElementById('ioiTabs');
  cat.posts.forEach((p,i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===ioiPost?' active':'');
    btn.textContent = p.title;
    if(i===ioiPost){ btn.style.borderColor=cat.color; btn.style.background=cat.color+'22'; btn.style.color=cat.color; }
    btn.onclick = () => { ioiPost=i; renderIOIPanel(); };
    tabs.appendChild(btn);
  });
  document.getElementById('ioiCard').innerHTML = `
    <div class="content-card" style="border-color:${cat.bd}">
      <div class="content-title" style="color:${cat.color}">${post.title}</div>
      <div class="content-body">${post.content}</div>
      <button class="copy-btn" id="copyIOIBtn" onclick="copyText('copyIOIBtn', \`${post.content.replace(/`/g,'\\`').replace(/\\/g,'\\\\')}\`)">Copy Post</button>
    </div>
  `;
}

function copyText(btnId, text) {
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    if(btn){ btn.textContent='Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent=btnId==='copyScriptBtn'?'Copy Script':'Copy Post'; btn.classList.remove('copied'); },2000); }
  });
}

// ─── INIT ──────────────────────────────────────────────────────────────────
renderNav();
renderScriptPanel();
</script>
</body>
